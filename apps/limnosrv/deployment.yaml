apiVersion: apps/v1
kind: Deployment
metadata:
  name: limnosrv
  labels:
    app: limnosrv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: limnosrv
  template:
    metadata:
      labels:
        app: limnosrv
    spec:
      containers:
      - name: limnosrv
        image: limnosrv
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: limnosrv-config
        - secretRef:
            name: limnosrv-secrets
        # limnosrv は DB を最大 60 秒待ち、マイグレーションを当ててから listen する。
        # その間に liveness で再起動されないよう、起動の完了を最大 2 分待つ
        startupProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
          failureThreshold: 24
        livenessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
