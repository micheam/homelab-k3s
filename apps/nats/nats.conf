# Shared NATS (JetStream) Configuration
#
# Clients authenticate with NKeys. Only public keys go in this file;
# each seed lives in the owning app's secrets.env (SOPS-encrypted).
# Anonymous connections are rejected (no no_auth_user).
#
# To add a client, append its public key to APPS.users and re-apply
# the kustomization. The ConfigMap hash changes, so the pod restarts.

server_name: nats-0
port: 4222
http_port: 8222

jetstream {
  store_dir: /data
  max_memory_store: 64MB
  max_file_store: 2GB
}

system_account: SYS

accounts {
  SYS {}
  APPS {
    jetstream: enabled
    users: [
      # ops: operator access via nats-box (full permissions, used for recovery)
      { nkey: "UDORNST4KCXIGEEN3PINDPSEQ2MODGWW2HC7B5PI6LZUDYVCSQMCNLZG" }
    ]
  }
}
