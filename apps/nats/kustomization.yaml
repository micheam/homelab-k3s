apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: nats

resources:
  - namespace.yaml
  - pvc.yaml
  - statefulset.yaml
  - service.yaml
  - nats-box.yaml
  - pv-local.yaml

configMapGenerator:
  - name: nats-config
    files:
      - nats.conf

secretGenerator:
  - name: nats-secrets
    envs:
      - secrets.env

images:
  - name: nats
    newTag: 2.15.0-alpine
  - name: natsio/nats-box
    newTag: 0.20.0
