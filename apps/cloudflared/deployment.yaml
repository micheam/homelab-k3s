apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app: cloudflared
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
      - name: cloudflared
        image: cloudflare/cloudflared
        command:
        - cloudflared
        - tunnel
        - --no-autoupdate
        - --loglevel
        - info
        - --metrics
        - 0.0.0.0:2000
        - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudflared-secrets
              key: TUNNEL_TOKEN
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        ports:
        - containerPort: 2000
          name: metrics
        # /ready は Cloudflare へのコネクションが 1 本以上あるときだけ 200 を返す。
        # ロールアウトでは、新しい Pod がつながってから古い Pod を止めることになる。
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 5
        # 公式の例は failureThreshold: 1 だが、瞬断では再起動せず 1 分待つ。
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          periodSeconds: 10
          failureThreshold: 6
